<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sistema de Supervisión SCADA - Brazo Robótico XK-LS5B</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
  body { background: #111112; color: #ffffff; min-height: 100vh; overflow: hidden; display: flex; flex-direction: column; }
  
  /* --- ENCABEZADO --- */
  header { background: #212124; height: 70px; display: flex; align-items: center; justify-content: space-between; padding: 0 20px; border-bottom: 2px solid #2a2a2d; }
  .header-title { font-size: 16px; font-weight: bold; letter-spacing: 0.05em; color: #ffffff; }
  .tablet-connection-info { font-family: 'Consolas', monospace; font-size: 12px; font-weight: bold; color: #4B8EF5; background: rgba(75, 142, 245, 0.1); padding: 6px 14px; border-radius: 4px; border: 1px solid rgba(75, 142, 245, 0.2); }
  .system-status { font-family: 'Consolas', monospace; font-size: 12px; font-weight: bold; color: #FF9900; background: rgba(255, 153, 0, 0.1); padding: 6px 14px; border-radius: 4px; border: 1px solid rgba(255, 153, 0, 0.2); }
  
  /* --- CONTENEDOR PRINCIPAL --- */
  #main-workspace { display: flex; flex: 1; height: calc(100vh - 70px); position: relative; }
  
  /* Columna Izquierda: Render 3D (Ocupa el espacio restante de forma fluida) */
  #canvas-container { flex: 1; position: relative; background: #141416; cursor: grab; }
  #canvas-container:active { cursor: grabbing; }
  #c { width: 100%; height: 100%; display: block; }
  .hint { position: absolute; bottom: 15px; left: 15px; color: #555558; font-size: 11px; letter-spacing: .05em; pointer-events: none; background: rgba(20,20,22,0.85); padding: 6px 14px; border-radius: 4px; border: 1px solid #2a2a2d; }

  /* Columna Derecha: Panel SCADA (Ancho fijo estructurado) */
  #scada-panel { width: 360px; background: #17171a; border-left: 2px solid #2a2a2d; display: flex; flex-direction: column; padding: 20px; overflow-y: auto; }
  
  .section-title { font-size: 11px; font-weight: bold; color: #4B8EF5; letter-spacing: 0.1em; text-transform: uppercase; margin-bottom: 12px; margin-top: 5px; }
  .connect-btn { background: #4B8EF5; color: white; border: none; padding: 12px; font-weight: bold; font-size: 12px; border-radius: 4px; cursor: pointer; transition: background 0.2s; width: 100%; margin-bottom: 20px; text-transform: uppercase; letter-spacing: 0.05em; }
  .connect-btn:hover { background: #357ae8; }
  
  /* Rejilla de Botones de Control */
  .grid-buttons { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-bottom: 20px; }
  .control-btn { background: #222225; color: #ffffff; border: 1px solid #2e2e33; padding: 12px 5px; font-size: 12px; border-radius: 4px; cursor: pointer; user-select: none; transition: background 0.15s; outline: none; }
  .control-btn:hover { background: #2c2c30; border-color: #4B8EF5; }
  .control-btn:active { background: #4B8EF5; color: white; }
  
  /* Botones del Sistema Inferiores */
  .system-actions { display: flex; gap: 8px; margin-bottom: 25px; }
  .sys-btn { flex: 1; padding: 10px; font-size: 12px; font-weight: bold; border: none; border-radius: 4px; cursor: pointer; color: white; }
  .btn-gray { background: #333335; }
  .btn-gray:hover { background: #404044; }
  .btn-red { background: #FF4444; }
  .btn-red:hover { background: #ff2a2a; }

  /* Panel de Integrantes */
  .sidebar-team { background: #121214; border: 1px solid #232326; padding: 14px; border-radius: 6px; }
  .member-list { list-style: none; }
  .member-list li { font-size: 12px; color: #c2c0b6; padding: 4px 0; display: flex; align-items: center; }
  .member-list li::before { content: "•"; color: #4B8EF5; font-weight: bold; display: inline-block; width: 12px; }

  /* --- RESPONSIVIDAD PARA TABLETS Y DISPOSITIVOS MÓVILES --- */
  @media (max-width: 900px) {
      body { overflow: auto; }
      header { height: auto; flex-direction: column; padding: 15px; gap: 10px; text-align: center; }
      .header-title { font-size: 14px; }
      .tablet-connection-info { width: 100%; text-align: center; font-size: 11px; }
      .system-status { width: 100%; text-align: center; font-size: 11px; }
      #main-workspace { flex-direction: column; height: auto; }
      #canvas-container { height: 400px; flex: none; }
      #scada-panel { width: 100%; border-left: none; border-top: 2px solid #2a2a2d; height: auto; }
  }
</style>
</head>
<body>

<header>
  <div class="header-title">SISTEMA DE SUPERVISIÓN SCADA · BRAZO ROBÓTICO XK-LS5B</div>
  <div id="tablet-info" class="tablet-connection-info">Cargando dirección de red...</div>
  <div id="lbl-estado" class="system-status">MODO EMULADO (HARDWARE OFFLINE)</div>
</header>

<div id="main-workspace">
  <div id="canvas-container">
    <canvas id="c"></canvas>
    <div class="hint">🖱 Arrastrar para rotar · Scroll para zoom</div>
  </div>

  <div id="scada-panel">
    
    <button class="connect-btn" onclick="inicializarSerial()">Conectar con Hardware PIC</button>

    <div class="grid-buttons">
      <button class="control-btn" onmousedown="enviarCmd('A')" onmouseup="enviarCmd('a')" ontouchstart="enviarCmd('A')" ontouchend="enviarCmd('a')">Base IZQ</button>
      <button class="control-btn" onmousedown="enviarCmd('B')" onmouseup="enviarCmd('b')" ontouchstart="enviarCmd('B')" ontouchend="enviarCmd('b')">Base DER</button>
      
      <button class="control-btn" onmousedown="enviarCmd('C')" onmouseup="enviarCmd('c')" ontouchstart="enviarCmd('C')" ontouchend="enviarCmd('c')">Hombro SUB</button>
      <button class="control-btn" onmousedown="enviarCmd('D')" onmouseup="enviarCmd('d')" ontouchstart="enviarCmd('D')" ontouchend="enviarCmd('d')">Hombro BAJ</button>
      
      <button class="control-btn" onmousedown="enviarCmd('E')" onmouseup="enviarCmd('e')" ontouchstart="enviarCmd('E')" ontouchend="enviarCmd('e')">Codo SUB</button>
      <button class="control-btn" onmousedown="enviarCmd('F')" onmouseup="enviarCmd('f')" ontouchstart="enviarCmd('F')" ontouchend="enviarCmd('f')">Codo BAJ</button>
      
      <button class="control-btn" onmousedown="enviarCmd('G')" onmouseup="enviarCmd('g')" ontouchstart="enviarCmd('G')" ontouchend="enviarCmd('g')">Muñeca SUB</button>
      <button class="control-btn" onmousedown="enviarCmd('H')" onmouseup="enviarCmd('h')" ontouchstart="enviarCmd('H')" ontouchend="enviarCmd('h')">Muñeca BAJ</button>
      
      <button class="control-btn" onmousedown="enviarCmd('I')" onmouseup="enviarCmd('i')" ontouchstart="enviarCmd('I')" ontouchend="enviarCmd('i')">Giro IZQ</button>
      <button class="control-btn" onmousedown="enviarCmd('J')" onmouseup="enviarCmd('j')" ontouchstart="enviarCmd('J')" ontouchend="enviarCmd('j')">Giro DER</button>
      
      <button class="control-btn" onmousedown="enviarCmd('K')" onmouseup="enviarCmd('k')" ontouchstart="enviarCmd('K')" ontouchend="enviarCmd('k')">Cerrar Pinza</button>
      <button class="control-btn" onmousedown="enviarCmd('L')" onmouseup="enviarCmd('l')" ontouchstart="enviarCmd('L')" ontouchend="enviarCmd('l')">Abrir Pinza</button>

    <div class="system-actions">
      <button class="sys-btn btn-gray" onclick="enviarCmd('R')">HOME</button>

    </div>

    <div class="section-title">Equipo de Ingeniería</div>
    <div class="sidebar-team">
      <ul class="member-list">
        <li>Bismark Choque Choque</li>
        <li>Lucas Daniel Condarco Calle</li>
        <li>Rodrigo Miguel Iporre Coca</li>
      </ul>
    </div>

  </div>
</div>

<script src="three.min.js"></script>
<script>
/* ========================================================
   CONEXIÓN INTERACTIVA CON LA API NATIVA DE PYTHON (REST & SSE)
   ======================================================== */
function enviarCmd(cmd) {
    console.log("Comando activado: " + cmd);
    
    // Enviar por API HTTP para que funcione en tablets y PC de forma unificada
    fetch(`/api/enviar?cmd=${cmd}`)
        .then(response => response.json())
        .then(data => {
            console.log("Respuesta API:", data);
        })
        .catch(err => console.error("Error al enviar comando:", err));
    
    // --- EFECTO VISUAL DE EMULACIÓN EN TIEMPO REAL (En caso de no haber telemetría física) ---
    if (cmd === 'A' && J[0]) J[0].rotation.y += 0.05;
    if (cmd === 'B' && J[0]) J[0].rotation.y -= 0.05;
    if (cmd === 'C' && J[1]) J[1].rotation.z += 0.05;
    if (cmd === 'D' && J[1]) J[1].rotation.z -= 0.05;
    if (cmd === 'E' && J[2]) J[2].rotation.z += 0.05;
    if (cmd === 'F' && J[2]) J[2].rotation.z -= 0.05;
    if (cmd === 'G' && J[3]) J[3].rotation.z += 0.05;
    if (cmd === 'H' && J[3]) J[3].rotation.z -= 0.05;
    if (cmd === 'I' && J[4]) J[4].rotation.y += 0.05;
    if (cmd === 'J' && J[4]) J[4].rotation.y -= 0.05;
    if (cmd === 'K' && gripL && gripR) {
        let currentOffset = gripR.position.x;
        currentOffset = Math.max(0.005, currentOffset - 0.005);
        gripL.position.x = -currentOffset;
        gripR.position.x = currentOffset;
    }
    if (cmd === 'L' && gripL && gripR) {
        let currentOffset = gripR.position.x;
        currentOffset = Math.min(0.035, currentOffset + 0.005);
        gripL.position.x = -currentOffset;
        gripR.position.x = currentOffset;
    }
}

function inicializarSerial() {
    const lbl = document.getElementById("lbl-estado");
    lbl.innerText = "CONECTANDO...";
    
    fetch('/api/conectar')
        .then(response => response.json())
        .then(data => {
            lbl.innerText = data.status;
            actualizarEstiloEstado(data.status);
        })
        .catch(err => {
            console.error("Error al conectar serial:", err);
            lbl.innerText = "ERROR DE CONEXIÓN";
            actualizarEstiloEstado("ERROR DE CONEXIÓN");
        });
}

function actualizarEstiloEstado(status) {
    const lbl = document.getElementById("lbl-estado");
    if (status.includes("ONLINE")) {
        lbl.style.color = "#00FF00";
        lbl.style.background = "rgba(0, 255, 0, 0.1)";
        lbl.style.borderColor = "rgba(0, 255, 0, 0.2)";
    } else {
        lbl.style.color = "#FF4444";
        lbl.style.background = "rgba(255, 68, 68, 0.1)";
        lbl.style.borderColor = "rgba(255, 68, 68, 0.2)";
    }
}

// Obtener estado del hardware y datos de la tablet al cargar
function inicializarServicioRed() {
    // 1. Obtener estado inicial del serial
    fetch('/api/estado')
        .then(res => res.json())
        .then(data => {
            const lbl = document.getElementById("lbl-estado");
            lbl.innerText = data.status;
            actualizarEstiloEstado(data.status);
        })
        .catch(err => console.error("Error obteniendo estado inicial:", err));

    // 2. Obtener dirección IP del servidor para mostrar en el encabezado
    fetch('/api/info')
        .then(res => res.json())
        .then(data => {
            const infoDiv = document.getElementById("tablet-info");
            infoDiv.innerText = `TABLET URL: http://${data.ip}:${data.port}`;
        })
        .catch(err => {
            document.getElementById("tablet-info").innerText = "MODO LOCAL / OFFLINE";
        });

    // 3. Conectarse al stream de Server-Sent Events (SSE) para recibir telemetría
    conectarTelemetria();
}

function conectarTelemetria() {
    const evtSource = new EventSource("/telemetria");
    
    evtSource.onmessage = function(event) {
        if (event.data === "ping") return;
        const src = event.data;
        if (src && src.startsWith("DAT:")) {
            const datos = src.replace("DAT:", "").split(",");
            if (datos.length === 2) {
                const id_art = parseInt(datos[0], 10);
                const angulo = parseFloat(datos[1]);
                if (!isNaN(id_art) && !isNaN(angulo)) {
                    window.setJointTarget(id_art, angulo);
                }
            }
        }
    };
    
    evtSource.onerror = function(err) {
        console.error("Reconectando telemetría en 3 segundos...", err);
        evtSource.close();
        setTimeout(conectarTelemetria, 3000);
    };
}

// Llamar a la inicialización al cargar
window.addEventListener('DOMContentLoaded', inicializarServicioRed);

/* ========================================================
   MODELO 3D DEL BRAZO ROBÓTICO XK-LS5B · 6 GDL
   ======================================================== */
const DEG = Math.PI / 180;
let scene, camera, renderer;
let J = [];
let gripL, gripR;
let isDragging = false, prevMouse = {x:0, y:0};
let sph = {theta: 0.8, phi: 1.1, r: 2.8};

const M = {
  alu:       () => new THREE.MeshStandardMaterial({color:0xdddddd, roughness:0.18, metalness:0.85}),
  aluDark:   () => new THREE.MeshStandardMaterial({color:0x2c2c2e, roughness:0.35, metalness:0.75}),
  steel:     () => new THREE.MeshStandardMaterial({color:0xcccccc, roughness:0.12, metalness:0.95}),
  metalBlack:() => new THREE.MeshStandardMaterial({color:0x1a1a1c, roughness:0.25, metalness:0.85}),
  plastic:   () => new THREE.MeshStandardMaterial({color:0x1a1a1a, roughness:0.5,  metalness:0.1}),
  rubber:    () => new THREE.MeshStandardMaterial({color:0x0d0d0d, roughness:0.85, metalness:0.0}),
  sensor:    () => new THREE.MeshStandardMaterial({color:0x39FF14, emissive:0x10aa10, roughness:0.2}),
  encoder:   () => new THREE.MeshStandardMaterial({color:0x222225, roughness:0.4, metalness:0.6})
};

function box(w,h,d,mat,px=0,py=0,pz=0,rx=0,ry=0,rz=0){
  const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat);
  m.position.set(px,py,pz);m.rotation.set(rx,ry,rz);
  m.castShadow=true;m.receiveShadow=true;return m;
}
function cyl(rt,rb,h,seg,mat,px=0,py=0,pz=0,rx=0,ry=0,rz=0){
  const m=new THREE.Mesh(new THREE.CylinderGeometry(rt,rb,h,seg),mat);
  m.position.set(px,py,pz);m.rotation.set(rx,ry,rz);
  m.castShadow=true;m.receiveShadow=true;return m;
}
function buildNema23(){
  const g=new THREE.Group();
  g.add(box(0.057,0.056,0.057,M.aluDark(),0,0,0));
  g.add(box(0.057,0.005,0.057,M.alu(),0,0.0285+0.0025,0));
  g.add(cyl(0.00317,0.00317,0.02,12,M.steel(),0,0.031+0.01,0));
  return g;
}
function buildNema17(){
  const g=new THREE.Group();
  g.add(box(0.042,0.040,0.042,M.aluDark(),0,0,0));
  g.add(box(0.042,0.004,0.042,M.alu(),0,0.02+0.002,0));
  g.add(cyl(0.0025,0.0025,0.018,12,M.steel(),0,0.022+0.009,0));
  return g;
}
function buildPulley(r,h){
  const g=new THREE.Group();
  g.add(cyl(r,r,h,28,M.metalBlack(),0,0,0));
  g.add(cyl(r*1.1,r*1.1,0.002,28,M.metalBlack(),0,h/2,0));
  g.add(cyl(r*1.1,r*1.1,0.002,28,M.metalBlack(),0,-h/2,0));
  return g;
}

function buildArm(){
  scene.add(box(0.32,0.02,0.22,M.aluDark(),0,0.01,0));
  scene.add(box(0.03,0.233,0.03,M.alu(),-0.12,0.1165, 0.07));
  scene.add(box(0.03,0.233,0.03,M.alu(), 0.12,0.1165, 0.07));
  scene.add(box(0.03,0.233,0.03,M.alu(),-0.12,0.1165,-0.07));
  scene.add(box(0.03,0.233,0.03,M.alu(), 0.12,0.1165,-0.07));
  scene.add(box(0.28,0.015,0.18,M.alu(),0,0.233+0.0075,0));

  const j1Motor=buildNema23();j1Motor.rotation.x=Math.PI/2;j1Motor.position.set(0.08,0.233-0.03,-0.05);scene.add(j1Motor);
  const p3_big=buildPulley(0.0675,0.015);p3_big.position.set(0,0.233+0.015,0);scene.add(p3_big);
  scene.add(cyl(0.018,0.018,0.025,16,M.encoder(),0,0.233-0.0125,-0.06));

  const j1=new THREE.Group();j1.position.set(0,0.233+0.02,0);scene.add(j1);J.push(j1);
  j1.add(cyl(0.07,0.07,0.01,32,M.alu(),0,0.005,0));
  j1.add(box(0.012,0.16,0.08,M.alu(),-0.052,0.08,0));
  j1.add(box(0.012,0.16,0.08,M.alu(), 0.052,0.08,0));
  j1.add(cyl(0.005,0.005,0.02,12,M.sensor(),-0.052,0.02,0.04,0,0,Math.PI/2));

  const j2=new THREE.Group();j2.position.set(0,0.16,0);j1.add(j2);J.push(j2);
  j2.add(cyl(0.008,0.008,0.12,20,M.steel(),0,0,0,0,0,Math.PI/2));
  const s2=new THREE.Mesh(new THREE.SphereGeometry(0.007,8,8),M.sensor());s2.position.set(0.03,0.02,0.04);j2.add(s2);
  const j2Motor=buildNema23();j2Motor.rotation.y=Math.PI/2;j2Motor.position.set(-0.075,0,0);j2.add(j2Motor);
  const p2s=buildPulley(0.025,0.012);p2s.rotation.y=Math.PI/2;p2s.position.set(0.038,0,0);j2.add(p2s);

  const lk2=new THREE.Group();j2.add(lk2);
  lk2.add(box(0.01,0.255,0.06,M.alu(),-0.038,0.175/2,0));
  lk2.add(box(0.01,0.255,0.06,M.alu(), 0.038,0.175/2,0));
  lk2.add(box(0.066,0.04,0.04,M.aluDark(),0,0.03,0));
  const j3Motor=buildNema23();j3Motor.position.set(0,0.05,-0.05);lk2.add(j3Motor);

  const j3=new THREE.Group();j3.position.set(0,0.175,0);lk2.add(j3);J.push(j3);
  j3.add(cyl(0.007,0.007,0.13,20,M.steel(),0,0,0,0,0,Math.PI/2));
  const s3=new THREE.Mesh(new THREE.SphereGeometry(0.007,8,8),M.sensor());s3.position.set(-0.03,0.02,0.04);j3.add(s3);
  const p2e=buildPulley(0.025,0.012);p2e.rotation.y=Math.PI/2;p2e.position.set(0.052,0,0);j3.add(p2e);

  const lk3=new THREE.Group();j3.add(lk3);
  lk3.add(box(0.008,0.22,0.04,M.alu(),-0.051,0.16/2,0));
  lk3.add(box(0.008,0.22,0.04,M.alu(), 0.051,0.16/2,0));
  lk3.add(box(0.094,0.03,0.03,M.aluDark(),0,0.04,0));

  const j4Motor=buildNema17();j4Motor.rotation.x=-Math.PI/2;j4Motor.position.set(-0.025,0.05,-0.03);lk3.add(j4Motor);
  const j5Motor=buildNema17();j5Motor.rotation.x=-Math.PI/2;j5Motor.position.set(0.025,0.05,-0.03);lk3.add(j5Motor);

  const j4=new THREE.Group();j4.position.set(0,0.16,0);lk3.add(j4);J.push(j4);
  j4.add(box(0.05,0.04,0.04,M.aluDark(),0,0.01,0));
  const p1w=buildPulley(0.014,0.01);p1w.rotation.y=Math.PI/2;p1w.position.set(0.028,0,0);j4.add(p1w);

  const j5=new THREE.Group();j5.position.set(0,0.03,0);j4.add(j5);J.push(j5);
  j5.add(cyl(0.018,0.018,0.04,24,M.steel(),0,0.02,0));
  j5.add(box(0.072,0.008,0.05,M.aluDark(),0,0.044,0));
  const j6Motor=buildNema17();j6Motor.position.set(0,0.065,-0.025);j5.add(j6Motor);

  const j6=new THREE.Group();j6.position.set(0,0.058,0);j5.add(j6);J.push(j6);
  j6.add(box(0.084,0.012,0.02,M.steel(),0,0.006,0));
  j6.add(box(0.01,0.008,0.014,M.plastic(),-0.04,0.012,0));
  j6.add(box(0.01,0.008,0.014,M.plastic(), 0.04,0.012,0));

  gripL=new THREE.Group();gripR=new THREE.Group();
  gripL.add(box(0.01,0.055,0.022,M.alu(),0,0.0275,0));
  gripL.add(box(0.004,0.02,0.02,M.rubber(),0.007,0.04,0));
  gripL.position.set(-0.018,0.012,0);
  gripR.add(box(0.01,0.055,0.022,M.alu(),0,0.0275,0));
  gripR.add(box(0.004,0.02,0.02,M.rubber(),-0.007,0.04,0));
  gripR.position.set(0.018,0.012,0);
  j6.add(gripL,gripR);
}

window.setJointTarget = function(id_articulacion, angulo_grados) {
    const radianes = angulo_grados * DEG;
    if (J[id_articulacion]) {
        if (id_articulacion === 0) J[0].rotation.y = radianes;
        else if (id_articulacion === 1) J[1].rotation.z = radianes;
        else if (id_articulacion === 2) J[2].rotation.z = radianes;
        else if (id_articulacion === 3) J[3].rotation.z = radianes;
        else if (id_articulacion === 4) J[4].rotation.y = radianes;
        else if (id_articulacion === 5) J[5].rotation.x = radianes;
    }
};

window.setGripper = function(apertura_mm) {
    const offset = Math.max(0.005, Math.min(0.035, apertura_mm / 1000));
    if(gripL && gripR) {
        gripL.position.x = -offset;
        gripR.position.x = offset;
    }
};

function init(){
  const canvas=document.getElementById('c');
  const wrap=document.getElementById('canvas-container');

  renderer=new THREE.WebGLRenderer({canvas,antialias:true});
  renderer.setPixelRatio(Math.min(window.devicePixelRatio,2));
  renderer.shadowMap.enabled=true;
  renderer.shadowMap.type=THREE.PCFSoftShadowMap;
  renderer.setClearColor(0x111113,1);
  renderer.toneMapping=THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure=1.3;

  scene=new THREE.Scene();
  scene.fog=new THREE.Fog(0x111113,2.5,6.5);

  camera=new THREE.PerspectiveCamera(45,1,0.05,20);

  scene.add(new THREE.AmbientLight(0xffffff,0.45));
  const kl=new THREE.DirectionalLight(0xfff6e5,1.5);
  kl.position.set(2.5,4.5,3.5);
  kl.castShadow=true;
  kl.shadow.mapSize.width=2048;
  kl.shadow.mapSize.height=2048;
  kl.shadow.bias=-0.0008;
  scene.add(kl);
  const fl=new THREE.DirectionalLight(0xd1e6ff,0.65);
  fl.position.set(-2.5,2.5,-2.5);
  scene.add(fl);

  const ground=new THREE.Mesh(
    new THREE.PlaneGeometry(15,15),
    new THREE.MeshStandardMaterial({color:0x161618,roughness:0.45,metalness:0.3})
  );
  ground.rotation.x=-Math.PI/2;
  ground.receiveShadow=true;
  scene.add(ground);

  const grid=new THREE.GridHelper(4,40,0x3d3d40,0x1f1f22);
  grid.position.y=0.001;
  scene.add(grid);

  buildArm();

  function resize(){
    const w=wrap.clientWidth, h=wrap.clientHeight;
    if(w>0 && h>0){
      renderer.setSize(w,h);
      camera.aspect=w/h;
      camera.updateProjectionMatrix();
    }
  }
  window.addEventListener('resize',resize);

  canvas.addEventListener('mousedown',e=>{
    isDragging=true;
    prevMouse={x:e.clientX,y:e.clientY};
  });
  window.addEventListener('mouseup',()=>isDragging=false);
  window.addEventListener('mousemove',e=>{
    if(!isDragging)return;
    const dx=e.clientX-prevMouse.x;
    const dy=e.clientY-prevMouse.y;
    sph.theta-=dx*0.007;
    sph.phi=Math.max(0.1, Math.min(Math.PI*0.47, sph.phi+dy*0.007));
    prevMouse={x:e.clientX,y:e.clientY};
  });

  canvas.addEventListener('wheel',e=>{
    sph.r=Math.max(1.0, Math.min(4.5, sph.r+e.deltaY*0.003));
    e.preventDefault();
  }, {passive:false});

  function animate(){
    requestAnimationFrame(animate);
    const x=sph.r*Math.sin(sph.phi)*Math.sin(sph.theta);
    const y=sph.r*Math.cos(sph.phi);
    const z=sph.r*Math.sin(sph.phi)*Math.cos(sph.theta);
    camera.position.set(x, y+0.3, z);
    camera.lookAt(0,0.42,0);
    renderer.render(scene,camera);
  }

  resize();
  setTimeout(resize, 100); // Forzar re-cálculo de viewport al cargar motor gráfico
  animate();
}

init();
</script>
</body>
</html>
